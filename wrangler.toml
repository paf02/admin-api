name = "store-platform-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "store-platform-db"
database_id = "a8b78cf5-63e1-4879-aa91-3eaf42a618b0"

# R2 Bucket for images (commented out until R2 is enabled)
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "puratech-store-images"

# CORS headers
[vars]
ALLOWED_ORIGINS = "*"

# Estela Pura runs the same code against its own database, so the two
# storefronts can never see each other's products.
#   deploy with: npx wrangler deploy --env estelapura
[env.estelapura]
name = "estelapura-api"

[env.estelapura.vars]
ALLOWED_ORIGINS = "*"

# Avisos de pedidos al panel (Web Push).
# La clave pública y el contacto son públicos por definición; la clave privada
# va como secret:  npx wrangler secret put VAPID_PRIVATE_KEY --env estelapura

# ── WhatsApp Cloud API ────────────────────────────────────────────────
# El número emisor NO se escribe acá ni en el código: se identifica por su ID.
# Hoy apunta al número de prueba que da Meta; el día que la tienda tenga su
# propio número, se cambia este ID y nada más.
#
# Valores públicos van como vars; los secretos, con `wrangler secret put`:
#   npx wrangler secret put WHATSAPP_ACCESS_TOKEN --env estelapura
#   npx wrangler secret put WHATSAPP_APP_SECRET   --env estelapura
#   npx wrangler secret put WHATSAPP_VERIFY_TOKEN --env estelapura
#
# WHATSAPP_PHONE_NUMBER_ID     = "…"   # ID del número emisor (no el número)
# WHATSAPP_BUSINESS_ACCOUNT_ID = "…"   # WABA a la que pertenece

VAPID_PUBLIC_KEY = "BAgUHBY32zP6oCH7x81Bte_qlaNI1FJlM7xZp2DFZLc2JCtoB5P5_RidY4iKI8vdhKCnoYYnKE8lc3McYRx1Txs"
VAPID_SUBJECT = "mailto:pedidos@estelapuracr.com"

# Respaldo diario a la 1:00 a. m. de Costa Rica (07:00 UTC)
[env.estelapura.triggers]
crons = ["0 7 * * *"]

[[env.estelapura.r2_buckets]]
binding = "RESPALDOS"
bucket_name = "estelapura-respaldos"

[[env.estelapura.d1_databases]]
binding = "DB"
database_name = "estelapura-db"
database_id = "727f8ddc-a5c3-4d33-96e3-3e8d381d34ec"
